<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CIRIYC RU — Compliance Assistant v1.3 BI · CIRIYC PRO</title>
    <link rel="icon" href="/logociriycprollc.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 2rem; max-width: 900px; }
        .logo { width: 180px; height: auto; margin: 0 auto 3rem; display: block; }
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #000000;
            letter-spacing: -1.5px;
            line-height: 1.15;
        }
        .lines {
            font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', ui-monospace, monospace;
            font-size: 1rem;
            color: #333333;
            margin-bottom: 3rem;
            line-height: 1.9;
        }
        .lines .label { color: #999999; margin-right: 0.5rem; }
        .signature {
            font-size: 0.85rem;
            color: #999999;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.7rem; letter-spacing: -0.5px; }
            .lines { font-size: 0.9rem; }
            .logo { width: 140px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logociriycprollc.png" alt="CIRIYC PRO" class="logo">
        <h1>CIRIYC RU — Compliance Assistant v1.3 BI</h1>
        <div class="lines">
            <div><span class="label">STATUS:</span>Architect Refactoring</div>
            <div><span class="label">DATE:</span>Until 11 August 2026</div>
        </div>
        <div class="signature">СИРИУС ПРО</div>
    </div>
</body>
</html>
